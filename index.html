.ita-ph-item .pick{position:absolute;inset:0;width:100%;border:0;background:transparent;cursor:pointer;padding:0}
.ita-ph-add{aspect-ratio:4/5;border-radius:12px;border:2px dashed var(--line,#ccc);background:var(--surface,#f4f4f4);color:var(--muted,#6b6b6b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:10px;font-weight:700;text-transform:uppercase}
.ita-ph-add input{display:none}
.ita-thumb{height:64px;width:56px;flex:none;border-radius:12px;object-fit:cover}
.ita-cp{margin-top:12px;border:1px solid var(--line,#e5e5e5);border-radius:20px;background:var(--card,#fff);padding:12px}
.ita-cp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line,#e5e5e5)}
.ita-cp-name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.ita-cp-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ita-cp-photos{display:flex;gap:8px}
.ita-cp-ph{position:relative;width:48px;height:60px;border-radius:10px;overflow:hidden;border:1px solid var(--line,#e5e5e5)}
.ita-cp-ph img{width:100%;height:100%;object-fit:cover;display:block}
.ita-cp-ph .rm{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ita-cp-add{width:48px;height:60px;border-radius:10px;border:2px dashed var(--line,#ccc);background:var(--surface,#f4f4f4);color:var(--muted,#6b6b6b);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ita-cp-add input{display:none}
.ita-pay{margin-bottom:24px;border:1px solid var(--line,#e5e5e5);background:var(--card,#fff);border-radius:20px;padding:16px}
.ita-pay h3{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.ita-pay p{margin:4px 0 12px;font-size:12px;line-height:1.5;color:var(--muted,#6b6b6b)}
.ita-pay .row{display:grid;gap:8px}
.ita-pay .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ita-pay input,.ita-pay select{height:46px;width:100%;box-sizing:border-box;border-radius:999px;border:1px solid var(--line,#e5e5e5);background:var(--surface,#f4f4f4);padding:0 16px;font-size:14px;outline:0;color:inherit}
.ita-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:999px;border:0;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s}
.ita-btn:active{transform:scale(.98)}
a.ita-btn{text-decoration:none;box-sizing:border-box}
.ita-btn.dark{background:#000;color:#fff}.ita-btn.lime{background:#C8FF00;color:#000}.ita-btn.ghost{background:var(--surface,#f4f4f4);color:inherit;border:1px solid var(--line,#e5e5e5)}
.ita-pixbox{margin-top:16px;border:2px solid #000;border-radius:20px;background:var(--card,#fff);padding:16px}
.ita-pixbox .lbl{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted,#6b6b6b)}
.ita-pixbox .val{margin:6px 0 10px;font-family:Anton,Impact,sans-serif;font-size:28px}
.ita-pixbox textarea{width:100%;height:84px;resize:none;box-sizing:border-box;border-radius:14px;border:1px solid var(--line,#e5e5e5);background:var(--surface,#f4f4f4);padding:10px 12px;font:11px/1.35 monospace;word-break:break-all;color:inherit}
.ita-pixbox ol{list-style:decimal;margin:12px 0 0;padding-left:20px;font-size:12px;line-height:1.55;color:var(--muted,#6b6b6b)}
.ita-bn{position:relative;max-width:1152px;margin:0 auto;padding:32px 16px 0}
.ita-bn-card{position:relative;overflow:hidden;border-radius:24px;background:#0a0a0a;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.ita-bn-track{display:flex;transition:transform .6s cubic-bezier(.22,.8,.25,1)}
.ita-bn-slide{position:relative;flex:0 0 100%;height:clamp(210px,56vw,320px);display:flex;align-items:flex-end;overflow:hidden}
.ita-bn-slide.txt{align-items:center;justify-content:center;text-align:center}
.ita-bn-bg{display:none}
.ita-bn-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.ita-bn-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.2) 42%,transparent 68%)}
.ita-bn-copy{position:relative;width:100%;padding:0 22px 40px}
.ita-bn-slide.txt .ita-bn-copy{padding:0 48px}
.ita-bn-ic{display:block;font-size:26px;margin-bottom:4px}
.ita-bn-h{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(26px,7vw,52px);line-height:1}
.ita-bn-sub{margin:6px 0 0;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.ita-bn-cta{display:inline-flex;margin-top:12px;align-items:center;background:#C8FF00;color:#000;border-radius:999px;padding:9px 18px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12px;text-decoration:none}
.ita-bn-slide.txt .ita-bn-cta{display:none}
.ita-bn-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px)}
@media(min-width:768px){.ita-bn-nav{display:flex}}
.ita-bn-nav.l{left:12px}.ita-bn-nav.r{right:12px}
.ita-bn-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px}
.ita-bn-dots button{height:8px;width:8px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.5);cursor:pointer;transition:all .25s}
.ita-bn-dots button.on{width:24px;background:#C8FF00}
/* hero mais compacto */
#inicio>div:first-child{padding-top:22px!important;padding-bottom:18px!important;gap:14px!important}
@media(min-width:640px){#inicio>div:first-child{padding-top:32px!important;padding-bottom:24px!important}}
#inicio h1{font-size:clamp(34px,9vw,58px)!important;line-height:.92!important;margin-top:12px!important}
#inicio h1+p{margin-top:12px!important;font-size:14px!important}
#inicio h1+p+div{margin-top:16px!important}
#inicio h1+p+div a{padding-top:10px!important;padding-bottom:10px!important}
#inicio h1+p+div+p{margin-top:14px!important}
#inicio>div:first-child>div:last-child{padding:0!important}
#inicio>div:first-child>div:last-child img{height:clamp(80px,22vw,128px)!important}
#inicio>div:first-child>div:last-child>div{margin-top:10px!important;padding:10px 18px!important}
.ita-bn-up{display:flex;align-items:center;gap:10px;margin-top:12px}
.ita-bn-prev{position:relative;width:64px;height:80px;border-radius:12px;overflow:hidden;border:1px solid var(--line,#e5e5e5);flex:none}
.ita-bn-prev img{width:100%;height:100%;object-fit:cover;display:block}
.ita-bn-prev .rm{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ita-bn-add{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;border:2px dashed var(--line,#ccc);background:var(--card,#fff);font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;text-align:center}
.ita-bn-add input{display:none}
</style>

  },

  },

  remove: (id) => setDoc(doc(db, "estoque", docId(id)), { id: id, deleted: true, updatedAt: Date.now() })
};
