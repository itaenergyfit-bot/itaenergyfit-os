<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ItaEnergyFit — diagnóstico do frete</title>
<style>body{font:16px system-ui;background:#10231b;color:#f5fff8;max-width:560px;margin:35px auto;padding:16px}main{border:1px solid #2ee59d;border-radius:14px;padding:22px}input,button{font:inherit;padding:12px;border-radius:8px}input{width:95%;margin:8px 0 16px}button{background:#2ee59d;color:#10231b;border:0;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#20362c;padding:14px;border-radius:8px}small{color:#b8d4c6}</style></head><body><main><h1>ITA ENERGY FIT</h1><h2>Teste isolado de frete</h2><p>Esta página serve apenas para verificar a comunicação com a SuperFrete. Não cria pedidos nem pagamentos.</p><form id="form"><label>CEP de destino (8 dígitos)<input id="cep" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="88850000" required></label><button type="submit">Testar consulta</button></form><pre id="resultado" role="status">Aguardando teste.</pre><small>Dimensões fictícias para diagnóstico: 30 × 25 × 12 cm, 0,5 kg. Não usar o preço exibido em uma venda.</small></main><script>
const form=document.getElementById('form'),out=document.getElementById('resultado');
form.addEventListener('submit',async e=>{e.preventDefault();const cep=document.getElementById('cep').value.replace(/\D/g,'');if(!/^\d{8}$/.test(cep)){out.textContent='Informe um CEP com 8 números.';return;}out.textContent='Consultando Worker...';try{const response=await fetch('https://itaenergyfit-fret.itaenergyfit.workers.dev/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cep,quantity:1,height:12,width:25,length:30,weight:0.5})});const raw=await response.text();let body;try{body=JSON.parse(raw)}catch{body={raw:raw.slice(0,400)}};out.textContent='HTTP '+response.status+'\n'+JSON.stringify(body,null,2);if(response.ok&&Array.isArray(body.options))out.textContent+='\n\nATENÇÃO: valores demonstrativos, não aprovados para cobrança.';}catch(err){out.textContent='Falha de comunicação: '+String(err.message||err)+'\nVerifique o navegador e as configurações CORS do Worker.';}});
</script></body></html>
